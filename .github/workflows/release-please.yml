name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_cli:
        description: Publish the CLI at the version on main, when a release left it unpublished
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      node_released: ${{ steps.release.outputs['sdks/node--release_created'] }}
      python_released: ${{ steps.release.outputs['sdks/python--release_created'] }}
      cli_released: ${{ steps.release.outputs['cli--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-node:
    needs: release-please
    if: needs.release-please.outputs.node_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: npm that can speak OIDC
        run: npm install -g 'npm@^11.5.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@memcell/sdk" run build
      - name: Verify package output
        run: |
          set -euo pipefail
          test -f sdks/node/dist/index.js
          test -f sdks/node/dist/index.d.ts
      - name: Publish to npm
        run: |
          cd sdks/node
          npm publish --provenance --access public
      - name: the attestation is on the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./sdks/node/package.json').version")"
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" = "true" ]; then
            echo "@memcell/sdk@$version has no provenance: the repository is private"
            exit 0
          fi
          for i in $(seq 1 60); do
            if curl -fsSH "Cache-Control: no-cache" "https://registry.npmjs.org/-/npm/v1/attestations/@memcell%2fsdk@$version" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const v=JSON.parse(d);process.exit(Array.isArray(v.attestations)&&v.attestations.length>0?0:1)})"; then
              echo "@memcell/sdk@$version is attested"; exit 0
            fi
            sleep 5
          done
          echo "@memcell/sdk@$version has no provenance attestation" >&2
          exit 1

  publish-cli:
    needs: [release-please, publish-node]
    if: always() && (needs.release-please.outputs.cli_released == 'true' || inputs.publish_cli) && (needs.publish-node.result == 'success' || needs.publish-node.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: npm that can speak OIDC
        run: npm install -g 'npm@^11.5.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@memcell/sdk" run build
      - run: pnpm --filter "memcell" run build
      - name: Resolve workspace dependencies & verify package output
        run: |
          set -euo pipefail
          test -f cli/dist/bin.js
          test -f cli/dist/index.js
          node -e '
            const fs = require("node:fs");
            const sdkPkg = JSON.parse(fs.readFileSync("sdks/node/package.json", "utf8"));
            const cliPkg = JSON.parse(fs.readFileSync("cli/package.json", "utf8"));
            if (cliPkg.dependencies && cliPkg.dependencies["@memcell/sdk"]) {
              cliPkg.dependencies["@memcell/sdk"] = "^" + sdkPkg.version;
            }
            for (const [dep, spec] of Object.entries(cliPkg.dependencies || {})) {
              if (typeof spec === "string" && spec.startsWith("workspace:")) {
                throw new Error("Unresolved workspace dependency in cli/package.json: " + dep + "=" + spec);
              }
            }
            fs.writeFileSync("cli/package.json", JSON.stringify(cliPkg, null, 2) + "\n");
          '
      - name: Publish to npm
        run: |
          cd cli
          npm publish --provenance --access public
      - name: the attestation is on the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./cli/package.json').version")"
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" = "true" ]; then
            echo "memcell@$version has no provenance: the repository is private"
            exit 0
          fi
          for i in $(seq 1 60); do
            if curl -fsSH "Cache-Control: no-cache" "https://registry.npmjs.org/-/npm/v1/attestations/memcell@$version" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const v=JSON.parse(d);process.exit(Array.isArray(v.attestations)&&v.attestations.length>0?0:1)})"; then
              echo "memcell@$version is attested"; exit 0
            fi
            sleep 5
          done
          echo "memcell@$version has no provenance attestation" >&2
          exit 1

  pin-plugin:
    needs: [release-please, publish-cli]
    if: always() && needs.publish-cli.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: raise the plugin pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd cli
          pinned="$(node -p "require('./server.json').version")"
          version="$(node -p "require('./package.json').version")"
          if [ "$pinned" = "$version" ]; then
            echo "already pinned to $version"
            exit 0
          fi
          node scripts/pin-cli.mjs "$pinned" "$version"
          branch="chore/pin-cli-$version"
          title="chore(plugin): pin memcell@$version after the CLI release"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add server.json plugins/memcell
          git commit -m "$title"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" \
            --body "Raises the plugin's \`npx\` pin, the plugin version and the \`server.json\` versions to the published CLI $version."
          gh pr merge "$branch" --squash --delete-branch

  publish-python:
    needs: release-please
    if: needs.release-please.outputs.python_released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/memcell
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          cd sdks/python
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
